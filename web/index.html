<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>What If · Match Engine</title>
</head>
<body>
  <div id="views"></div>

  <div id="scorebug" class="hud">
    <div class="sb-live"><span class="dot"></span>LIVE</div>
    <div class="sb-main">
      <div class="sb-team home"><i></i><span class="short"></span></div>
      <div class="sb-score"><span class="h">0</span><span class="sep"></span><span class="a">0</span></div>
      <div class="sb-team away"><span class="short"></span><i></i></div>
      <div class="sb-clock">00:00</div>
    </div>
  </div>

  <div id="tactics" class="hud">
    <div class="tp-head">TACTICAL VIEW</div>
    <div class="tp-row tp-teams"><span></span><b class="home"></b><b class="away"></b></div>
    <div class="tp-row"><span>SHAPE</span><b data-k="label-home"></b><b data-k="label-away"></b></div>
    <div class="tp-row"><span>LINE HEIGHT</span><b data-k="line-home"></b><b data-k="line-away"></b></div>
    <div class="tp-row"><span>LENGTH × WIDTH</span><b data-k="cmp-home"></b><b data-k="cmp-away"></b></div>
    <div class="tp-row"><span>PRESSURE ON BALL</span><b data-k="press" class="wide"></b></div>
  </div>

  <div id="banner" class="hud"><div class="bn-bar"></div><div class="bn-title">GOAL</div><div class="bn-sub"></div></div>
  <div id="caption" class="hud"><div class="cp-title"></div><div class="cp-text"></div></div>
  <div id="whatif" class="hud"><span class="wi-tag">WHAT IF</span><span class="wi-text"></span></div>

  <div id="controls" class="hud">
    <button id="play" title="Play / pause (space)">▶</button>
    <div id="timeline"><div id="markers"></div><input id="scrub" type="range" min="0" max="1" step="0.05" value="0" /></div>
    <div id="time">00:00</div>
    <select id="speed" title="Playback speed"><option>0.5</option><option selected>1</option><option>2</option><option>4</option></select>
    <div class="seg" id="cams">
      <button data-cam="broadcast" title="1">BROADCAST</button><button data-cam="tactical" title="2">TACTICAL</button><button data-cam="player" title="3">PLAYER</button>
    </div>
    <label id="lensbox"><span>CASUAL</span><input id="lens" type="range" min="0" max="1" step="0.01" value="0.2" /><span>TACTICAL</span></label>
    <div class="seg" id="viewmode">
      <button data-view="single">MATCH</button><button data-view="split">SPLIT</button><button data-view="ghost">GHOST</button>
    </div>
  </div>
  <div id="error"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
